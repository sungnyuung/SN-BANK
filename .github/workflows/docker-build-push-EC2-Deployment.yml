name: Docker Build and Push and EC2 Deployment(도커 허브 없이 EC2로 이미지 전달)
on:
  push:
    branches:
      - '**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 깃허브 저장소에서 소스 코드 가져옴
      - name: Checkout Code
        uses: actions/checkout@v3

      # Java 17 환경 설정
      - name: actions/setup-java@v3
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      # gradlew에 실행 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # gradle로 애플리케이션 빌드
      - name: Build with Gradle
        run: ./gradlew clean build

      # 프로젝트를 압축해서 전송
      - name: Compress Project
        run: zip -r app.zip . -x "*.git*"

      - name: Deploy Code to EC2
        uses: appleboy/scp-action@v0.1.8
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: ./app.zip
          target: ~/app.zip

      # EC2에서 Docker 빌드 및 실행
      - name: Build and Run Docker on EC2
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 디렉토리 생성 및 압축 해제
            mkdir -p ~/app
            unzip -o ~/app.zip -d ~/app || { echo "Failed to unzip app.zip"; exit 1; }
  
            ls ~/app/Dockerfile || { echo "Dockerfile not found"; exit 1; }
  
            cd ~/app
            docker build -t your-app:${{ github.sha }} . || { echo "Docker build failed"; exit 1; }
  
            docker stop my-app || true
            docker rm my-app || true
  
            docker run -d \
            --name my-app \
            -e SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/bankDB \
            -e SPRING_DATASOURCE_USERNAME=root \
            -e SPRING_DATASOURCE_PASSWORD=${{ secrets.DATABASE_PASSWORD }} \
            -p 8080:8080 \
            your-app:${{ github.sha }}