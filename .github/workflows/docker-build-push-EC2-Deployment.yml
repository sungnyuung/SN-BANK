name: Docker Build, Push, and EC2 Deployment
on:
  push:
    branches:
      - '**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 깃허브 저장소에서 소스 코드 가져옴
      - name: Checkout Code
        uses: actions/checkout@v3

      # Java 17 환경 설정
      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      # gradlew에 실행 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # gradle로 애플리케이션 빌드
      - name: Build with Gradle
        run: ./gradlew clean build

      # DockerHub 로그인
      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Docker 이미지 빌드 및 푸시 (캐싱 추가)
      - name: Build and Push Docker Image
        run: |
          IMAGE_NAME=${{ secrets.DOCKER_USERNAME }}/your-app
          TAG=${{ github.sha }}

          docker buildx build \
            --platform linux/amd64 \
            --cache-from=type=registry,ref=$IMAGE_NAME:cache \
            --cache-to=type=registry,ref=$IMAGE_NAME:cache,mode=max \
            -t $IMAGE_NAME:$TAG \
            --push .

      # EC2에 배포
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # ECR에서 Docker 이미지 풀링
            docker pull ${{ secrets.DOCKER_USERNAME }}/your-app:${{ github.sha }}

            # 기존 컨테이너 중지 및 삭제
            docker stop my-app || true
            docker rm my-app || true

            # 새 컨테이너 실행
            docker run -d \
              --name my-app \
              --link mysql-container:mysql \
              -e SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/bankDB \
              -e SPRING_DATASOURCE_USERNAME=root \
              -e SPRING_DATASOURCE_PASSWORD=${{ secrets.DATABASE_PASSWORD }} \
              -p 8080:8080 \
              ${{ secrets.DOCKER_USERNAME }}/your-app:${{ github.sha }}